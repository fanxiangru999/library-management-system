<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 分类管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html">图书管理</a></li>
                <li><a href="/admin/categories.html" class="active">分类管理</a></li>
                <li><a href="/admin/students.html">学生管理</a></li>
                <li><a href="/admin/borrows.html">借阅管理</a></li>
                <li><a href="/admin/statistics.html">统计分析</a></li>
                <li><a href="/admin/password.html">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>分类管理</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <h3>图书分类列表</h3>
                        <button class="btn btn-success" onclick="showAddModal()">添加分类</button>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr><th>ID</th><th>分类名称</th><th>描述</th><th>图书数量</th><th>操作</th></tr>
                            </thead>
                            <tbody id="categoryTable"></tbody>
                        </table>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加分类</h3>
                <span class="modal-close" onclick="hideModal('categoryModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="categoryId">
                    <div class="form-group">
                        <label>分类名称</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <input type="text" id="description">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="hideModal('categoryModal')">取消</button>
                <button class="btn btn-primary" onclick="saveCategory()">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        let allCategories = [];
        let currentPage = 1;
        const pageSize = 10;
        
        async function loadCategories() {
            const result = await request('/category/listWithCount');
            if (result && result.code === 200) {
                allCategories = result.data;
                currentPage = 1;
                renderCategoriesWithPagination();
            }
        }
        
        function renderCategoriesWithPagination() {
            const totalPages = Math.ceil(allCategories.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const categoriesToShow = allCategories.slice(start, end);
            document.getElementById('categoryTable').innerHTML = categoriesToShow.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.name}</td>
                    <td>${c.description || '-'}</td>
                    <td>${c.bookCount || 0}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-info" onclick="editCategory(${c.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})">删除</button>
                    </td>
                </tr>
            `).join('');
            renderPagination(totalPages, allCategories.length);
        }
        
        function renderPagination(totalPages, total) {
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
            html += `<span class="pagination-info">共 ${total} 条，${totalPages} 页</span>`;
            document.getElementById('pagination').innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            renderCategoriesWithPagination();
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加分类';
            document.getElementById('categoryForm').reset();
            document.getElementById('categoryId').value = '';
            showModal('categoryModal');
        }
        
        async function editCategory(id) {
            const result = await request(`/category/${id}`);
            if (result && result.code === 200) {
                const c = result.data;
                document.getElementById('modalTitle').textContent = '编辑分类';
                document.getElementById('categoryId').value = c.id;
                document.getElementById('name').value = c.name;
                document.getElementById('description').value = c.description || '';
                showModal('categoryModal');
            }
        }
        
        async function saveCategory() {
            const id = document.getElementById('categoryId').value;
            const data = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value
            };
            const url = id ? `/category/${id}` : '/category/add';
            const method = id ? 'PUT' : 'POST';
            const result = await request(url, { method, body: JSON.stringify(data) });
            if (result && result.code === 200) {
                showToast(id ? '修改成功' : '添加成功');
                hideModal('categoryModal');
                loadCategories();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function deleteCategory(id) {
            if (!confirm('确定删除该分类吗？')) return;
            const result = await request(`/category/${id}`, { method: 'DELETE' });
            if (result && result.code === 200) {
                showToast('删除成功');
                loadCategories();
            } else {
                showToast(result?.message || '删除失败', 'error');
            }
        }
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
            loadCategories();
        }
        init();
    </script>
</body>
</html>
