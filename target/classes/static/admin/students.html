<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 学生管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html">图书管理</a></li>
                <li><a href="/admin/categories.html">分类管理</a></li>
                <li><a href="/admin/students.html" class="active">学生管理</a></li>
                <li><a href="/admin/borrows.html">借阅管理</a></li>
                <li><a href="/admin/statistics.html">统计分析</a></li>
                <li><a href="/admin/password.html">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>学生管理</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <div class="search-box">
                            <input type="text" id="keyword" placeholder="搜索学号/姓名">
                            <button class="btn btn-info" onclick="searchStudents()">搜索</button>
                        </div>
                        <button class="btn btn-success" onclick="showAddModal()">添加学生</button>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr><th>学号</th><th>姓名</th><th>班级</th><th>联系方式</th><th>用户名</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody id="studentTable"></tbody>
                        </table>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加学生</h3>
                <span class="modal-close" onclick="hideModal('studentModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <input type="hidden" id="studentId">
                    <div class="form-group">
                        <label>学号</label>
                        <input type="text" id="studentNo" required>
                    </div>
                    <div class="form-group">
                        <label>姓名</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <input type="text" id="className">
                    </div>
                    <div class="form-group">
                        <label>联系方式</label>
                        <input type="text" id="phone">
                    </div>
                    <div class="form-group">
                        <label>最大借阅数</label>
                        <input type="number" id="maxBorrow" value="5" min="1">
                    </div>
                    <div id="accountFields">
                        <div class="form-group">
                            <label>登录用户名</label>
                            <input type="text" id="loginUsername">
                        </div>
                        <div class="form-group">
                            <label>登录密码</label>
                            <input type="password" id="loginPassword">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="hideModal('studentModal')">取消</button>
                <button class="btn btn-primary" onclick="saveStudent()">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        let allStudents = [];
        let currentPage = 1;
        const pageSize = 10;
        
        async function loadStudents() {
            const result = await request('/student/list');
            if (result && result.code === 200) {
                allStudents = result.data;
                currentPage = 1;
                renderStudentsWithPagination();
            }
        }
        
        async function searchStudents() {
            const keyword = document.getElementById('keyword').value;
            const url = keyword ? `/student/search?keyword=${encodeURIComponent(keyword)}` : '/student/list';
            const result = await request(url);
            if (result && result.code === 200) {
                allStudents = result.data;
                currentPage = 1;
                renderStudentsWithPagination();
            }
        }
        
        function renderStudentsWithPagination() {
            const totalPages = Math.ceil(allStudents.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const studentsToShow = allStudents.slice(start, end);
            renderStudents(studentsToShow);
            renderPagination(totalPages, allStudents.length);
        }
        
        function renderStudents(students) {
            document.getElementById('studentTable').innerHTML = students.map(s => `
                <tr>
                    <td>${s.studentNo}</td>
                    <td>${s.name}</td>
                    <td>${s.className || '-'}</td>
                    <td>${s.phone || '-'}</td>
                    <td>${s.user?.username || '-'}</td>
                    <td>${s.user?.status === 1 ? '<span class="badge badge-success">正常</span>' : '<span class="badge badge-danger">禁用</span>'}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-info" onclick="editStudent(${s.id})">编辑</button>
                        <button class="btn btn-sm btn-warning" onclick="toggleStatus(${s.id}, ${s.user?.status === 1 ? 0 : 1})">${s.user?.status === 1 ? '禁用' : '启用'}</button>
                        <button class="btn btn-sm btn-success" onclick="resetPassword(${s.id})">重置密码</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function renderPagination(totalPages, total) {
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
            html += `<span class="pagination-info">共 ${total} 条，${totalPages} 页</span>`;
            document.getElementById('pagination').innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            renderStudentsWithPagination();
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加学生';
            document.getElementById('studentForm').reset();
            document.getElementById('studentId').value = '';
            document.getElementById('accountFields').style.display = 'block';
            document.getElementById('studentNo').disabled = false;
            showModal('studentModal');
        }
        
        async function editStudent(id) {
            const result = await request(`/student/${id}`);
            if (result && result.code === 200) {
                const s = result.data;
                document.getElementById('modalTitle').textContent = '编辑学生';
                document.getElementById('studentId').value = s.id;
                document.getElementById('studentNo').value = s.studentNo;
                document.getElementById('studentNo').disabled = true;
                document.getElementById('name').value = s.name;
                document.getElementById('className').value = s.className || '';
                document.getElementById('phone').value = s.phone || '';
                document.getElementById('maxBorrow').value = s.maxBorrow;
                document.getElementById('accountFields').style.display = 'none';
                showModal('studentModal');
            }
        }
        
        async function saveStudent() {
            const id = document.getElementById('studentId').value;
            const data = {
                studentNo: document.getElementById('studentNo').value,
                name: document.getElementById('name').value,
                className: document.getElementById('className').value,
                phone: document.getElementById('phone').value,
                maxBorrow: parseInt(document.getElementById('maxBorrow').value)
            };
            
            if (!id) {
                data.username = document.getElementById('loginUsername').value;
                data.password = document.getElementById('loginPassword').value;
                if (!data.username || !data.password) {
                    showToast('用户名和密码不能为空', 'error');
                    return;
                }
            }
            
            const url = id ? `/student/${id}` : '/student/add';
            const method = id ? 'PUT' : 'POST';
            const result = await request(url, { method, body: JSON.stringify(data) });
            if (result && result.code === 200) {
                showToast(id ? '修改成功' : '添加成功');
                hideModal('studentModal');
                loadStudents();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function toggleStatus(id, status) {
            const result = await request(`/student/${id}/status`, { method: 'PUT', body: JSON.stringify({ status }) });
            if (result && result.code === 200) {
                showToast('操作成功');
                loadStudents();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function resetPassword(id) {
            const newPassword = prompt('请输入新密码:');
            if (!newPassword) return;
            const result = await request(`/student/${id}/password`, { method: 'PUT', body: JSON.stringify({ password: newPassword }) });
            if (result && result.code === 200) {
                showToast('密码重置成功');
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
            loadStudents();
        }
        init();
    </script>
</body>
</html>
