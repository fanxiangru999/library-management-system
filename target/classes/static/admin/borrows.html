<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 借阅管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html">图书管理</a></li>
                <li><a href="/admin/categories.html">分类管理</a></li>
                <li><a href="/admin/students.html">学生管理</a></li>
                <li><a href="/admin/borrows.html" class="active">借阅管理</a></li>
                <li><a href="/admin/statistics.html">统计分析</a></li>
                <li><a href="/admin/password.html">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>借阅管理</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <div>
                            <button class="btn btn-info" onclick="loadAll()">全部记录</button>
                            <button class="btn btn-warning" onclick="loadCurrent()">当前借阅</button>
                            <button class="btn btn-danger" onclick="loadOverdue()">超期记录</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr><th>学号</th><th>学生姓名</th><th>图书编号</th><th>图书名称</th><th>借阅时间</th><th>应还时间</th><th>归还时间</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody id="borrowTable"></tbody>
                        </table>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        let allRecords = [];
        let currentPage = 1;
        const pageSize = 10;
        
        function renderRecordsWithPagination() {
            const totalPages = Math.ceil(allRecords.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const recordsToShow = allRecords.slice(start, end);
            renderRecords(recordsToShow);
            renderPagination(totalPages, allRecords.length);
        }
        
        function renderRecords(records) {
            document.getElementById('borrowTable').innerHTML = records.map(r => `
                <tr>
                    <td>${r.student?.studentNo || '-'}</td>
                    <td>${r.student?.name || '-'}</td>
                    <td>${r.book?.bookNo || '-'}</td>
                    <td>${r.book?.title || '-'}</td>
                    <td>${formatDate(r.borrowTime)}</td>
                    <td>${formatDate(r.dueTime)}</td>
                    <td>${formatDate(r.returnTime)}</td>
                    <td>${getStatusBadge(r.status, r.dueTime)}</td>
                    <td>
                        ${r.status === 0 ? `<button class="btn btn-sm btn-success" onclick="returnBook(${r.id})">归还</button>` : '-'}
                    </td>
                </tr>
            `).join('');
        }
        
        function renderPagination(totalPages, total) {
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
            html += `<span class="pagination-info">共 ${total} 条，${totalPages} 页</span>`;
            document.getElementById('pagination').innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            renderRecordsWithPagination();
        }
        
        async function loadAll() {
            const result = await request('/borrow/list');
            if (result && result.code === 200) {
                allRecords = result.data;
                currentPage = 1;
                renderRecordsWithPagination();
            }
        }
        
        async function loadCurrent() {
            const result = await request('/borrow/current');
            if (result && result.code === 200) {
                allRecords = result.data;
                currentPage = 1;
                renderRecordsWithPagination();
            }
        }
        
        async function loadOverdue() {
            const result = await request('/borrow/overdue');
            if (result && result.code === 200) {
                allRecords = result.data;
                currentPage = 1;
                renderRecordsWithPagination();
            }
        }
        
        async function returnBook(id) {
            if (!confirm('确定归还该图书吗？')) return;
            const result = await request(`/borrow/return/${id}`, { method: 'POST' });
            if (result && result.code === 200) {
                showToast('归还成功');
                loadAll();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
            loadAll();
        }
        init();
    </script>
</body>
</html>
