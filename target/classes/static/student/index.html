<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端 - 首页</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">学生端</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/student/index.html" class="active">首页</a></li>
                <li><a href="/student/books.html">图书查询</a></li>
                <li><a href="/student/myborrow.html">我的借阅</a></li>
                <li><a href="/student/profile.html">个人信息</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>欢迎使用图书管理系统</h2></div>
                <div><span id="studentName"></span></div>
            </div>
            <div class="content">
                <div class="stats-row">
                    <div class="stat-card primary">
                        <div class="stat-value" id="currentBorrow">0</div>
                        <div class="stat-label">当前借阅</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-value" id="maxBorrow">5</div>
                        <div class="stat-label">最大可借</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-value" id="canBorrow">5</div>
                        <div class="stat-label">还可借阅</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header"><h3>当前借阅</h3></div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr><th>图书编号</th><th>书名</th><th>借阅时间</th><th>应还时间</th><th>状态</th><th>操作</th></tr>
                            </thead>
                            <tbody id="currentBorrowTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        async function loadProfile() {
            const result = await request('/student/profile');
            if (result && result.code === 200) {
                const student = result.data;
                document.getElementById('studentName').textContent = student.name;
                document.getElementById('currentBorrow').textContent = student.currentBorrowCount || 0;
                document.getElementById('maxBorrow').textContent = student.maxBorrow;
                document.getElementById('canBorrow').textContent = student.maxBorrow - (student.currentBorrowCount || 0);
            }
        }
        
        async function loadCurrentBorrow() {
            const result = await request('/borrow/my/current');
            if (result && result.code === 200) {
                document.getElementById('currentBorrowTable').innerHTML = result.data.map(r => `
                    <tr>
                        <td>${r.book?.bookNo || '-'}</td>
                        <td>${r.book?.title || '-'}</td>
                        <td>${formatDate(r.borrowTime)}</td>
                        <td>${formatDate(r.dueTime)}</td>
                        <td>${getStatusBadge(r.status, r.dueTime)}</td>
                        <td><button class="btn btn-sm btn-success" onclick="returnBook(${r.id})">归还</button></td>
                    </tr>
                `).join('') || '<tr><td colspan="6" style="text-align:center;">暂无借阅记录</td></tr>';
            }
        }
        
        async function returnBook(id) {
            if (!confirm('确定归还该图书吗？')) return;
            const result = await request(`/borrow/return/${id}`, { method: 'POST' });
            if (result && result.code === 200) {
                showToast('归还成功');
                loadProfile();
                loadCurrentBorrow();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        loadProfile();
        loadCurrentBorrow();
    </script>
</body>
</html>
