<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 图书管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html" class="active">图书管理</a></li>
                <li><a href="/admin/categories.html">分类管理</a></li>
                <li><a href="/admin/students.html">学生管理</a></li>
                <li><a href="/admin/borrows.html">借阅管理</a></li>
                <li><a href="/admin/statistics.html">统计分析</a></li>
                <li><a href="/admin/password.html">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>图书管理</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="card">
                    <div class="card-header">
                        <div class="search-box">
                            <input type="text" id="keyword" placeholder="搜索书名/作者/ISBN">
                            <select id="categoryFilter"><option value="">全部分类</option></select>
                            <button class="btn btn-info" onclick="searchBooks()">搜索</button>
                        </div>
                        <button class="btn btn-success" onclick="showAddModal()">添加图书</button>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr><th>图书编号</th><th>书名</th><th>作者</th><th>出版社</th><th>分类</th><th>库存</th><th>可借</th><th>操作</th></tr>
                            </thead>
                            <tbody id="bookTable"></tbody>
                        </table>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加图书</h3>
                <span class="modal-close" onclick="hideModal('bookModal')">&times;</span>
            </div>
            <div class="modal-body">
                <form id="bookForm">
                    <input type="hidden" id="bookId">
                    <div class="form-group">
                        <label>图书编号</label>
                        <input type="text" id="bookNo" required>
                    </div>
                    <div class="form-group">
                        <label>书名</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-group">
                        <label>作者</label>
                        <input type="text" id="author">
                    </div>
                    <div class="form-group">
                        <label>出版社</label>
                        <input type="text" id="publisher">
                    </div>
                    <div class="form-group">
                        <label>ISBN</label>
                        <input type="text" id="isbn">
                    </div>
                    <div class="form-group">
                        <label>分类</label>
                        <select id="categoryId"></select>
                    </div>
                    <div class="form-group">
                        <label>总数量</label>
                        <input type="number" id="totalCount" value="1" min="1">
                    </div>
                    <div class="form-group">
                        <label>可借数量</label>
                        <input type="number" id="availableCount" value="1" min="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="hideModal('bookModal')">取消</button>
                <button class="btn btn-primary" onclick="saveBook()">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        let categories = [];
        let allBooks = [];
        let currentPage = 1;
        const pageSize = 10;
        
        async function loadCategories() {
            const result = await request('/category/list');
            if (result && result.code === 200) {
                categories = result.data;
                const options = '<option value="">请选择</option>' + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
                document.getElementById('categoryId').innerHTML = options;
                document.getElementById('categoryFilter').innerHTML = '<option value="">全部分类</option>' + categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            }
        }
        
        async function loadBooks() {
            const result = await request('/book/list');
            if (result && result.code === 200) {
                allBooks = result.data;
                currentPage = 1;
                renderBooksWithPagination();
            }
        }
        
        async function searchBooks() {
            const keyword = document.getElementById('keyword').value;
            const categoryId = document.getElementById('categoryFilter').value;
            let url = keyword ? `/book/search?keyword=${encodeURIComponent(keyword)}` : (categoryId ? `/book/category/${categoryId}` : '/book/list');
            const result = await request(url);
            if (result && result.code === 200) {
                allBooks = result.data;
                currentPage = 1;
                renderBooksWithPagination();
            }
        }
        
        function renderBooksWithPagination() {
            const totalPages = Math.ceil(allBooks.length / pageSize);
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const booksToShow = allBooks.slice(start, end);
            renderBooks(booksToShow);
            renderPagination(totalPages, allBooks.length);
        }
        
        function renderBooks(books) {
            document.getElementById('bookTable').innerHTML = books.map(book => `
                <tr>
                    <td>${book.bookNo}</td>
                    <td>${book.title}</td>
                    <td>${book.author || '-'}</td>
                    <td>${book.publisher || '-'}</td>
                    <td>${book.category?.name || '-'}</td>
                    <td>${book.totalCount}</td>
                    <td>${book.availableCount}</td>
                    <td class="action-buttons">
                        <button class="btn btn-sm btn-info" onclick="editBook(${book.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteBook(${book.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }
        
        function renderPagination(totalPages, total) {
            if (totalPages <= 1) {
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            let html = `<button onclick="goToPage(1)" ${currentPage === 1 ? 'disabled' : ''}>首页</button>`;
            html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;
            const maxShow = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxShow / 2));
            let endPage = Math.min(totalPages, startPage + maxShow - 1);
            if (endPage - startPage < maxShow - 1) startPage = Math.max(1, endPage - maxShow + 1);
            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
            }
            html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;
            html += `<button onclick="goToPage(${totalPages})" ${currentPage === totalPages ? 'disabled' : ''}>末页</button>`;
            html += `<span class="pagination-info">共 ${total} 条，${totalPages} 页</span>`;
            document.getElementById('pagination').innerHTML = html;
        }
        
        function goToPage(page) {
            currentPage = page;
            renderBooksWithPagination();
        }
        
        function showAddModal() {
            document.getElementById('modalTitle').textContent = '添加图书';
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            showModal('bookModal');
        }
        
        async function editBook(id) {
            const result = await request(`/book/${id}`);
            if (result && result.code === 200) {
                const book = result.data;
                document.getElementById('modalTitle').textContent = '编辑图书';
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookNo').value = book.bookNo;
                document.getElementById('title').value = book.title;
                document.getElementById('author').value = book.author || '';
                document.getElementById('publisher').value = book.publisher || '';
                document.getElementById('isbn').value = book.isbn || '';
                document.getElementById('categoryId').value = book.categoryId || '';
                document.getElementById('totalCount').value = book.totalCount;
                document.getElementById('availableCount').value = book.availableCount;
                showModal('bookModal');
            }
        }
        
        async function saveBook() {
            const id = document.getElementById('bookId').value;
            const data = {
                bookNo: document.getElementById('bookNo').value,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                publisher: document.getElementById('publisher').value,
                isbn: document.getElementById('isbn').value,
                categoryId: document.getElementById('categoryId').value || null,
                totalCount: parseInt(document.getElementById('totalCount').value),
                availableCount: parseInt(document.getElementById('availableCount').value)
            };
            
            const url = id ? `/book/${id}` : '/book/add';
            const method = id ? 'PUT' : 'POST';
            const result = await request(url, { method, body: JSON.stringify(data) });
            
            if (result && result.code === 200) {
                showToast(id ? '修改成功' : '添加成功');
                hideModal('bookModal');
                loadBooks();
            } else {
                showToast(result?.message || '操作失败', 'error');
            }
        }
        
        async function deleteBook(id) {
            if (!confirm('确定删除该图书吗？')) return;
            const result = await request(`/book/${id}`, { method: 'DELETE' });
            if (result && result.code === 200) {
                showToast('删除成功');
                loadBooks();
            } else {
                showToast(result?.message || '删除失败', 'error');
            }
        }
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
            await loadCategories();
            loadBooks();
        }
        init();
    </script>
</body>
</html>
