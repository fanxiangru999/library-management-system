<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 统计分析</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html">图书管理</a></li>
                <li><a href="/admin/categories.html">分类管理</a></li>
                <li><a href="/admin/students.html">学生管理</a></li>
                <li><a href="/admin/borrows.html">借阅管理</a></li>
                <li><a href="/admin/statistics.html" class="active">统计分析</a></li>
                <li><a href="/admin/password.html">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>统计分析</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="stats-row">
                    <div class="stat-card primary">
                        <div class="stat-value" id="bookTypeCount">0</div>
                        <div class="stat-label">图书种类</div>
                    </div>
                    <div class="stat-card success">
                        <div class="stat-value" id="totalBooks">0</div>
                        <div class="stat-label">图书总量</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-value" id="studentCount">0</div>
                        <div class="stat-label">学生人数</div>
                    </div>
                    <div class="stat-card danger">
                        <div class="stat-value" id="borrowCount">0</div>
                        <div class="stat-label">累计借阅</div>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="card">
                        <div class="card-header"><h3>月度借阅统计</h3></div>
                        <div class="card-body">
                            <table class="table">
                                <thead><tr><th>月份</th><th>借阅次数</th></tr></thead>
                                <tbody id="monthlyTable"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>借阅排行榜 TOP 10</h3></div>
                        <div class="card-body">
                            <table class="table">
                                <thead><tr><th>排名</th><th>学号</th><th>姓名</th><th>借阅次数</th></tr></thead>
                                <tbody id="topBorrowersTable"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card" style="margin-top: 20px;">
                    <div class="card-header"><h3>热门图书 TOP 10</h3></div>
                    <div class="card-body">
                        <table class="table">
                            <thead><tr><th>排名</th><th>图书编号</th><th>书名</th><th>作者</th><th>借阅次数</th></tr></thead>
                            <tbody id="hotBooksTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        async function loadDashboard() {
            const result = await request('/statistics/dashboard');
            if (result && result.code === 200) {
                document.getElementById('bookTypeCount').textContent = result.data.bookTypeCount;
                document.getElementById('totalBooks').textContent = result.data.totalBooks;
                document.getElementById('studentCount').textContent = result.data.studentCount;
                document.getElementById('borrowCount').textContent = result.data.borrowCount;
            }
        }
        
        async function loadMonthly() {
            const result = await request('/statistics/monthly');
            if (result && result.code === 200) {
                document.getElementById('monthlyTable').innerHTML = result.data.map(m => 
                    `<tr><td>${m.month}</td><td>${m.count}</td></tr>`
                ).join('');
            }
        }
        
        async function loadTopBorrowers() {
            const result = await request('/statistics/topBorrowers?limit=10');
            if (result && result.code === 200) {
                document.getElementById('topBorrowersTable').innerHTML = result.data.map((b, i) => 
                    `<tr><td>${i + 1}</td><td>${b.student_no}</td><td>${b.name}</td><td>${b.borrow_count}</td></tr>`
                ).join('');
            }
        }
        
        async function loadHotBooks() {
            const result = await request('/statistics/hotBooks?limit=10');
            if (result && result.code === 200) {
                document.getElementById('hotBooksTable').innerHTML = result.data.map((b, i) => 
                    `<tr><td>${i + 1}</td><td>${b.bookNo}</td><td>${b.title}</td><td>${b.author || '-'}</td><td>${b.borrowCount || 0}</td></tr>`
                ).join('');
            }
        }
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
            loadDashboard();
            loadMonthly();
            loadTopBorrowers();
            loadHotBooks();
        }
        init();
    </script>
</body>
</html>
