<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 修改密码</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">管理员后台</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/admin/index.html">首页概览</a></li>
                <li><a href="/admin/books.html">图书管理</a></li>
                <li><a href="/admin/categories.html">分类管理</a></li>
                <li><a href="/admin/students.html">学生管理</a></li>
                <li><a href="/admin/borrows.html">借阅管理</a></li>
                <li><a href="/admin/statistics.html">统计分析</a></li>
                <li><a href="/admin/password.html" class="active">修改密码</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>修改密码</h2></div>
                <div><span id="username"></span></div>
            </div>
            <div class="content">
                <div class="card" style="max-width: 500px;">
                    <div class="card-header"><h3>修改密码</h3></div>
                    <div class="card-body">
                        <form id="passwordForm">
                            <div class="form-group">
                                <label>原密码</label>
                                <input type="password" id="oldPassword" required>
                            </div>
                            <div class="form-group">
                                <label>新密码</label>
                                <input type="password" id="newPassword" required>
                            </div>
                            <div class="form-group">
                                <label>确认新密码</label>
                                <input type="password" id="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-primary">修改密码</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showToast('两次输入的新密码不一致', 'error');
                return;
            }
            
            const result = await request('/auth/password', {
                method: 'POST',
                body: JSON.stringify({ oldPassword, newPassword })
            });
            
            if (result && result.code === 200) {
                showToast('密码修改成功');
                document.getElementById('passwordForm').reset();
            } else {
                showToast(result?.message || '修改失败', 'error');
            }
        });
        
        async function init() {
            const info = await request('/auth/info');
            if (info && info.code === 200) document.getElementById('username').textContent = info.data.username;
        }
        init();
    </script>
</body>
</html>
