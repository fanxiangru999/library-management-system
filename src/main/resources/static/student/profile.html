<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生端 - 个人信息</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>图书管理系统</h3>
                <p style="font-size: 12px; color: #95a5a6;">学生端</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="/student/index.html">首页</a></li>
                <li><a href="/student/books.html">图书查询</a></li>
                <li><a href="/student/myborrow.html">我的借阅</a></li>
                <li><a href="/student/profile.html" class="active">个人信息</a></li>
                <li><a href="javascript:logout()">退出登录</a></li>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div><h2>个人信息</h2></div>
                <div><span id="studentName"></span></div>
            </div>
            <div class="content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="card">
                        <div class="card-header"><h3>基本信息</h3></div>
                        <div class="card-body">
                            <table class="table">
                                <tr><td style="width:100px;font-weight:bold;">学号</td><td id="infoStudentNo"></td></tr>
                                <tr><td style="font-weight:bold;">姓名</td><td id="infoName"></td></tr>
                                <tr><td style="font-weight:bold;">班级</td><td id="infoClassName"></td></tr>
                                <tr><td style="font-weight:bold;">联系方式</td><td id="infoPhone"></td></tr>
                                <tr><td style="font-weight:bold;">最大可借</td><td id="infoMaxBorrow"></td></tr>
                                <tr><td style="font-weight:bold;">当前借阅</td><td id="infoCurrentBorrow"></td></tr>
                            </table>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header"><h3>修改密码</h3></div>
                        <div class="card-body">
                            <form id="passwordForm">
                                <div class="form-group">
                                    <label>原密码</label>
                                    <input type="password" id="oldPassword" required>
                                </div>
                                <div class="form-group">
                                    <label>新密码</label>
                                    <input type="password" id="newPassword" required>
                                </div>
                                <div class="form-group">
                                    <label>确认新密码</label>
                                    <input type="password" id="confirmPassword" required>
                                </div>
                                <button type="submit" class="btn btn-primary">修改密码</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script>
        async function loadProfile() {
            const result = await request('/student/profile');
            if (result && result.code === 200) {
                const s = result.data;
                document.getElementById('studentName').textContent = s.name;
                document.getElementById('infoStudentNo').textContent = s.studentNo;
                document.getElementById('infoName').textContent = s.name;
                document.getElementById('infoClassName').textContent = s.className || '-';
                document.getElementById('infoPhone').textContent = s.phone || '-';
                document.getElementById('infoMaxBorrow').textContent = s.maxBorrow;
                document.getElementById('infoCurrentBorrow').textContent = s.currentBorrowCount || 0;
            }
        }
        
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showToast('两次输入的新密码不一致', 'error');
                return;
            }
            
            const result = await request('/auth/password', {
                method: 'POST',
                body: JSON.stringify({ oldPassword, newPassword })
            });
            
            if (result && result.code === 200) {
                showToast('密码修改成功');
                document.getElementById('passwordForm').reset();
            } else {
                showToast(result?.message || '修改失败', 'error');
            }
        });
        
        loadProfile();
    </script>
</body>
</html>
