<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书管理系统 - 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo-icon">📚</div>
            <h2>图书管理系统</h2>
            <p class="subtitle">Library Management System</p>
            <form id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登 录</button>
            </form>
            <p style="text-align: center; margin-top: 25px; color: #95a5a6; font-size: 13px;">
                管理员账号: admin / admin123
            </p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                if (result.code === 200) {
                    const user = result.data.user;
                    window.location.href = user.role === 'ADMIN' ? '/admin/index.html' : '/student/index.html';
                } else {
                    alert(result.message || '登录失败');
                }
            } catch (error) {
                alert('登录失败，请稍后重试');
            }
        });
    </script>
</body>
</html>
